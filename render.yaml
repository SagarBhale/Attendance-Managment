services:
  - type: web
    name: attendance-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: GEO_LAT
        value: "28.6139"
      - key: GEO_LNG
        value: "77.2090"
      - key: GEO_RADIUS_METERS
        value: "500"
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        sync: false
